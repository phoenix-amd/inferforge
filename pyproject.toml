[project]
name = "inferforge"
version = "1.0.0"
description = "AMD InferForge — Unified LLM Inference Optimization Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "bcrypt>=4.0",
    "pyjwt>=2.8.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
